name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Start demo app
        run: |
          python demo_app/server.py &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/health && break; sleep 1; done
      - name: Run suite
        run: pytest --browser ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.browser }}
          path: reports/
          retention-days: 14

  classifier:
    name: classifier self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Start demo app
        run: |
          python demo_app/server.py &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/health && break; sleep 1; done
      - name: Run the intentional demo failures (expected to fail)
        run: DEMO_FAILURES=1 pytest --browser chromium tests/test_demo_failures.py || true
      - name: Check every failure landed in the right bucket
        run: python scripts/check_classifier.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classifier-demo-reports
          path: reports/
          retention-days: 14
